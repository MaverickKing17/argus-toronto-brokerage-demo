<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Yorkville Luxury Group | The Penthouse Collection</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- CSS Rule to suppress native Botpress floating blue button container -->
    <style>
      body > *:not(#root):not(script):not(style):not(link) {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        position: absolute !important;
        width: 0 !important;
        height: 0 !important;
        top: -9999px !important;
        left: -9999px !important;
      }
    </style>

    <!-- Botpress Webchat Scripts with Native Widget Suppressed -->
    <script src="https://cdn.botpress.cloud/webchat/v3.7/inject.js"></script>
    <script>
      window.botpressWebChat = new Proxy(window.botpressWebChat || {}, {
        get(target, prop) {
          if (prop === 'init') {
            return function(config) {
              config = config || {};
              config.hideWidget = true;
              config.enableFab = false;
              config.showPoweredBy = false;
              if (target.init) return target.init(config);
            };
          }
          return target[prop];
        },
        set(target, prop, value) {
          if (prop === 'init' && typeof value === 'function') {
            target[prop] = function(config) {
              config = config || {};
              config.hideWidget = true;
              config.enableFab = false;
              config.showPoweredBy = false;
              return value.call(this, config);
            };
            return true;
          }
          target[prop] = value;
          return true;
        }
      });
    </script>
    <script src="https://files.bpcontent.cloud/2026/08/12/16/20260812163048-R8VWGZH1.js" defer></script>
  </head>
  <body class="bg-zinc-900 text-zinc-100 font-sans antialiased selection:bg-amber-500/30 selection:text-amber-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Active DOM Cleaner MutationObserver ensuring any injected native Botpress elements are hidden
      const cleanBotpressNodes = () => {
        document.body.childNodes.forEach((node) => {
          if (node.nodeType === 1 && node.id !== 'root' && node.tagName !== 'SCRIPT' && node.tagName !== 'STYLE' && node.tagName !== 'LINK') {
            const el = node;
            el.style.setProperty('display', 'none', 'important');
            el.style.setProperty('visibility', 'hidden', 'important');
            el.style.setProperty('opacity', '0', 'important');
            el.style.setProperty('pointer-events', 'none', 'important');
            el.style.setProperty('top', '-9999px', 'important');
          }
        });
      };
      cleanBotpressNodes();
      const obs = new MutationObserver(cleanBotpressNodes);
      obs.observe(document.body, { childList: true, subtree: true });
    </script>
  </body>
</html>
